name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-demo
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: |
          npm run build
          node scripts/build-pages.mjs
        env:
          VITE_DEMO_MODE: "true"
          VITE_PAGES_PREVIEW: "true"
          VITE_BASE_PATH: /inventarioTI2/
      - name: Install Chromium for modern demo check
        run: npx --no-install playwright install --with-deps chromium
      - name: Check interactive modern demo before publishing
        run: node tests/demo/modernization.mjs
      - name: Verify GitHub Actions is the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')
          if [ "$pages_build_type" != "workflow" ]; then
            echo "::error::Select GitHub Actions in Settings > Pages > Build and deployment > Source, then rerun this workflow."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
